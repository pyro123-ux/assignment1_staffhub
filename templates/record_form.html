{% extends "base.html" %}
{% block title %}New Record | StaffHub{% endblock %}
{% block content %}
<section class="card">
    <h1>Submit New Record</h1>
    <form method="post" class="stacked-form">
        <label for="title">Title</label>
        <input id="title" name="title" maxlength="120" required>

        <label for="category">Category</label>
        <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            {% for option in categories %}
            <option value="{{ option }}">{{ option }}</option>
            {% endfor %}
        </select>

        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            {% for option in priorities %}
            <option value="{{ option }}" {% if option == "Medium" %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
        </select>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="6" required></textarea>

        <button type="submit">Submit Record</button>
    </form>
</section>
{% endblock %}
